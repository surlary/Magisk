name: MagiskNext Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build MagiskNext artifacts
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          is-asset-build: true

      - name: Build release
        run: 
          git apply patch.patch
          ./build.py -vr all

      - name: Stop gradle daemon
        run: ./app/gradlew --stop

      - name: Upload MagiskNext artifact
        uses: actions/upload-artifact@v7
        with:
          name: MagiskNext-${{ github.sha }}
          path: out
          compression-level: 9
